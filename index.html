<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Frida!</title>
<meta name="description" content="Happy Birthday, Frida!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed WebGL canvas; cinematic overlays (letterbox, location cards) layered above; HUD pinned to corners */
:root{
  --ink:#fffaf2; --ink-dim:rgba(255,250,242,.82); --glass:rgba(255,246,236,.2); --line:rgba(255,250,242,.35);
  --accent:#ff8a73; --accent-deep:#d4594a; --sun:#ffd166; --sky:#7cc6ff;
  --display:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --ui:'Nunito','Trebuchet MS',system-ui,-apple-system,sans-serif;
  --mono:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#07090b;color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
kbd{font:600 12px/1 var(--mono);display:inline-flex;align-items:center;justify-content:center;min-width:26px;padding:6px 8px;border-radius:6px;background:rgba(245,239,228,.14);border:1px solid rgba(245,239,228,.22);border-bottom-width:3px;color:var(--ink);letter-spacing:.02em}

/* letterbox */
body::before,body::after{content:"";position:fixed;left:0;right:0;height:0;background:#000;z-index:8;transition:height 1.1s cubic-bezier(.7,0,.2,1);pointer-events:none}
body::before{top:0} body::after{bottom:0}
body.cine::before,body.cine::after{height:6vh}

/* loader */
#loader{position:fixed;inset:0;z-index:40;background:linear-gradient(180deg,#8fd0ff,#ffd6c2);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .6s}
#loader.show{opacity:1;pointer-events:auto}
.load-in{text-align:center}
.load-title{font:700 clamp(34px,5vw,54px)/1 var(--display);margin:0 0 14px;color:#fff;text-shadow:0 3px 0 rgba(212,89,74,.35)}
#loaderMsg{font:600 16px var(--mono);color:#fff}
.load-bar{width:160px;height:8px;border-radius:99px;background:rgba(255,255,255,.4);margin:22px auto 0;overflow:hidden}
.load-bar i{display:block;width:40%;height:100%;border-radius:99px;background:#fff;animation:slide 1.2s ease-in-out infinite}

/* fade + big transition text */
#fade{position:fixed;inset:0;z-index:30;background:#fff3e6;opacity:1;pointer-events:none}
#bigText{position:fixed;inset:0;z-index:31;display:grid;place-content:center;text-align:center;font:500 clamp(36px,6vw,72px)/1.05 var(--display);color:#1b232b;opacity:0;transition:opacity 1s;pointer-events:none;padding:0 24px}
#bigText.show{opacity:1}
#bigText small{display:block;font:500 13px var(--mono);letter-spacing:.22em;text-transform:uppercase;margin-top:18px;color:inherit;opacity:.7}
body.dark-big #bigText{color:var(--ink)}

/* intro title */
#title{position:fixed;left:0;right:0;top:22vh;z-index:9;text-align:center;pointer-events:none;padding:0 20px}
#title h1{margin:0;font:700 clamp(46px,8vw,100px)/.95 var(--display);letter-spacing:.005em;color:#fff;text-shadow:0 4px 0 rgba(212,89,74,.45),0 12px 40px rgba(120,60,40,.3);opacity:0;transform:translateY(18px);filter:blur(10px);transition:opacity 2.4s ease,transform 2.8s cubic-bezier(.2,.7,.2,1),filter 2.4s ease}
#title p{margin:16px 0 0;font:600 18px var(--mono);color:#fff;text-shadow:0 2px 10px rgba(120,60,40,.35);opacity:0;transition:opacity 2s 1.2s}
#title.show h1{opacity:1;transform:none;filter:none}
#title.show p{opacity:1}
#press{position:fixed;left:50%;bottom:calc(6vh + 34px);transform:translateX(-50%) translateY(10px);z-index:9;display:flex;gap:12px;align-items:center;font:500 15px var(--ui);color:#fff;opacity:0;transition:opacity .8s,transform .8s;pointer-events:none;white-space:nowrap}
#press.show{opacity:1;transform:translateX(-50%)}
#press kbd{background:var(--sun);color:#5a3200;border-color:rgba(0,0,0,.2);animation:pulse 1.6s ease-in-out infinite}

/* HUD */
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:18px;z-index:10;display:flex;flex-direction:column;gap:10px;align-items:flex-start;opacity:0;transform:translateY(-8px);transition:opacity .8s,transform .8s;pointer-events:none}
#hud.show{opacity:1;transform:none}
#chapter{display:flex;gap:7px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid var(--line);padding:9px 12px;border-radius:999px}
#chapter .pip{width:14px;height:18px;border-radius:8px 8px 3px 3px;border:2px solid rgba(255,255,255,.85);transition:background .4s}
#chapter .pip.on{background:var(--sun);border-color:var(--sun);box-shadow:0 0 12px rgba(255,209,102,.8)}
#chapter .pip.pop{animation:pip .7s cubic-bezier(.34,1.56,.64,1)}
#objective{display:flex;gap:10px;align-items:center;max-width:min(420px,calc(100vw - 36px));font:800 17px/1.35 var(--ui);color:#fff;text-shadow:0 2px 8px rgba(60,40,30,.55);opacity:0;transition:opacity .6s}
#objective.show{opacity:1}
#objective.pop .dia{animation:pop .7s cubic-bezier(.34,1.56,.64,1)}
.dia{width:12px;height:12px;flex:none;transform:rotate(45deg);border-radius:3px;background:var(--sun);box-shadow:0 0 10px rgba(255,209,102,.8)}
#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;z-index:12;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);display:grid;place-items:center;cursor:pointer}
#mute svg{width:18px;height:18px}
#mute .off{display:none} #mute.off .on{display:none} #mute.off .off{display:block}
#minimap{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);right:16px;z-index:10;width:240px;height:110px;border-radius:14px;border:1.5px solid rgba(255,255,255,.55);box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:none}
@media (max-width:640px){#minimap{width:170px;height:78px}}
#mute:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* world prompt + objective marker */
#prompt{position:fixed;left:0;top:0;z-index:11;display:flex;gap:10px;align-items:center;padding:7px 16px 7px 7px;border-radius:999px;background:rgba(255,255,255,.92);color:#5a3a2e;box-shadow:0 8px 24px rgba(90,50,30,.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);font:800 15px var(--ui);white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-50%,-100%) scale(.6);transition:opacity .2s,transform .35s cubic-bezier(.34,1.56,.64,1)}
#prompt.show{opacity:1;transform:translate(-50%,-100%) scale(1)}
#prompt kbd{background:var(--accent);color:#fff;border-color:rgba(0,0,0,.15);animation:pulse 1.2s ease-in-out infinite}
#marker{position:fixed;left:0;top:0;z-index:9;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;transition:opacity .4s;pointer-events:none}
#marker.show{opacity:1}
#marker .dia{width:14px;height:14px;background:rgba(242,179,107,.35);box-shadow:0 0 16px rgba(242,179,107,.6);animation:float 2s ease-in-out infinite}
#markerDist{font:500 11px var(--mono);color:var(--ink);text-shadow:0 1px 6px rgba(0,0,0,.8);font-variant-numeric:tabular-nums}
#marker.edge{opacity:.75}

/* location card */
#card{position:fixed;left:clamp(20px,6vw,80px);bottom:calc(10.5vh + 40px);z-index:12;max-width:min(640px,calc(100vw - 40px));pointer-events:none}
#cardEyebrow{font:500 12px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--accent);opacity:0;transform:translateX(-10px);transition:opacity .8s,transform 1s}
#cardTitle{font:500 clamp(52px,8vw,96px)/.95 var(--display);margin:10px 0 14px;color:#fff;text-shadow:0 2px 40px rgba(0,0,0,.45);clip-path:inset(0 100% 0 0);transition:clip-path 1.4s cubic-bezier(.7,0,.2,1) .15s}
#cardRule{height:1px;background:linear-gradient(90deg,rgba(245,239,228,.8),rgba(245,239,228,0));transform-origin:left;transform:scaleX(0);transition:transform 1.4s cubic-bezier(.7,0,.2,1) .35s}
#cardSub{font:500 12px/1.6 var(--mono);letter-spacing:.12em;color:var(--ink-dim);margin-top:12px;opacity:0;transition:opacity 1s .8s}
#card.show #cardEyebrow{opacity:1;transform:none} #card.show #cardTitle{clip-path:inset(0 0 0 0)} #card.show #cardRule{transform:scaleX(1)} #card.show #cardSub{opacity:1}
#card:not(.show) #cardTitle{transition-delay:0s;transition-duration:.8s}

#skip{position:fixed;right:20px;bottom:calc(6vh + 16px);z-index:12;display:flex;gap:8px;align-items:center;font:500 12px var(--ui);color:var(--ink-dim);opacity:0;transition:opacity .6s;pointer-events:none}
#skip.show{opacity:.85}
#sub{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);transform:translateX(-50%);z-index:12;max-width:min(640px,calc(100vw - 40px));text-align:center;font:500 16px/1.45 var(--ui);color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.85);opacity:0;transition:opacity .6s;pointer-events:none}
#sub.show{opacity:1}

/* media gallery: slide through every photo and video from a stop, download any of them */
#gallery{position:fixed;inset:0;z-index:32;display:grid;grid-template-rows:auto 1fr auto auto;background:radial-gradient(ellipse at 50% 30%,rgba(58,36,30,.93),rgba(16,11,10,.97));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transition:opacity .45s ease;touch-action:none;user-select:none;-webkit-user-select:none}
#gallery.show{opacity:1}
.g-top{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 10px}
.g-titles{flex:1;min-width:0}
#gStop{font:700 13px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
#gTitle{font:700 clamp(24px,3.6vw,38px)/1.05 var(--display);color:#fff4ea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gCount{font:700 14px var(--ui);color:rgba(255,244,234,.75);padding:7px 12px;border-radius:999px;background:rgba(255,244,234,.1);white-space:nowrap}
.g-btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,244,234,.25);background:rgba(255,244,234,.1);color:#fff4ea;font:800 14px var(--ui);text-decoration:none;cursor:pointer;transition:background .2s,transform .15s}
.g-btn:hover{background:rgba(255,244,234,.2)} .g-btn:active{transform:scale(.96)}
.g-btn svg{width:18px;height:18px;flex:none}
#gDownload{background:var(--accent);border-color:transparent;color:#2a1410}
#gDownload:hover{background:#ffa08c}
#gClose{width:42px;padding:0;justify-content:center}
.g-stage{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 72px;overflow:hidden}
.g-media{position:relative;max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.g-media img,.g-media video{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.5);background:#000}
.g-media.in-l{animation:gInL .38s cubic-bezier(.2,.8,.2,1)} .g-media.in-r{animation:gInR .38s cubic-bezier(.2,.8,.2,1)} .g-media.in-0{animation:gIn0 .5s ease}
@keyframes gInL{from{opacity:0;transform:translateX(-60px) scale(.98)}to{opacity:1;transform:none}}
@keyframes gInR{from{opacity:0;transform:translateX(60px) scale(.98)}to{opacity:1;transform:none}}
@keyframes gIn0{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.g-spin{position:absolute;width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,244,234,.2);border-top-color:var(--accent);animation:gSpin .8s linear infinite}
@keyframes gSpin{to{transform:rotate(360deg)}}
.g-nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,244,234,.25);background:rgba(20,12,10,.55);color:#fff4ea;display:grid;place-items:center;cursor:pointer;z-index:2;transition:background .2s,opacity .2s}
.g-nav:hover{background:rgba(255,138,115,.6)} .g-nav[disabled]{opacity:.25;pointer-events:none}
.g-nav svg{width:24px;height:24px} #gPrev{left:12px} #gNext{right:12px}
.g-strip{display:flex;gap:8px;padding:10px 18px 6px;overflow-x:auto;scrollbar-width:thin;touch-action:pan-x;justify-content:safe center}
.g-thumb{position:relative;flex:none;width:64px;height:64px;border-radius:10px;overflow:hidden;border:2px solid transparent;opacity:.55;cursor:pointer;padding:0;background:#222;transition:opacity .2s,border-color .2s,transform .2s}
.g-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.g-thumb.on{opacity:1;border-color:var(--accent);transform:translateY(-2px)}
.g-thumb .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:18px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.g-foot{display:flex;justify-content:center;gap:18px;align-items:center;padding:4px 16px calc(env(safe-area-inset-bottom,0px) + 14px);font:700 14px var(--ui);color:rgba(255,244,234,.7)}
.g-foot kbd{margin-right:4px}
@media (max-width:640px){.g-stage{padding:4px 8px}.g-nav{width:42px;height:42px;background:rgba(20,12,10,.4)}#gPrev{left:6px}#gNext{right:6px}.g-btn .lbl{display:none}#gDownload{width:42px;padding:0;justify-content:center}.g-thumb{width:52px;height:52px}.g-foot .keys{display:none}}

/* birthday message over the party */
#wish{position:fixed;left:50%;bottom:calc(6vh + 70px);transform:translate(-50%,20px);z-index:30;width:min(760px,calc(100vw - 32px));text-align:center;padding:22px 26px 24px;border-radius:26px;background:rgba(255,248,240,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 24px 60px rgba(160,60,60,.28);opacity:0;transition:opacity 1s,transform 1s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#wish.show{opacity:1;transform:translate(-50%,0)}
#wishTitle{margin:0;font:700 clamp(32px,5.4vw,58px)/1.05 var(--display);color:#e0457b;text-shadow:0 2px 0 #ffd23f;min-height:1.05em}
#wishLove{margin:12px 0 0;font:800 clamp(18px,2.4vw,24px)/1.3 var(--ui);color:#7a3b2e;min-height:1.3em}
#wishSun{margin:10px auto 0;max-width:46ch;font:700 clamp(15px,1.9vw,19px)/1.5 var(--ui);color:#a0522d;min-height:1.5em}
.typing::after{content:"";display:inline-block;width:.08em;height:.9em;margin-left:.06em;background:currentColor;vertical-align:-.08em;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#title h1{min-height:1em}
#title.show h1{transition-duration:.7s,.7s,.7s}
#title p#titleSub{font:700 clamp(17px,2.4vw,24px)/1.35 var(--ui);max-width:30ch;margin:18px auto 0;opacity:0;transform:translateY(8px);transition:opacity 1.2s ease,transform 1.2s ease}
#title.show p#titleSub.in{opacity:1;transform:none}
#credit{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 1.4vh);z-index:9;display:flex;gap:7px;align-items:center;justify-content:center;font:700 14px var(--ui);letter-spacing:.04em;color:#fff;opacity:0;transition:opacity 1.2s ease 1s;pointer-events:none}
#credit.show{opacity:.92}
#credit svg{flex:none}
@media (min-aspect-ratio: 5/4){#wish{bottom:calc(6vh + 8px);padding:12px 22px 14px;width:min(700px,calc(100vw - 32px))} #wishTitle{font-size:clamp(26px,3.4vw,44px)} #wishLove{margin-top:6px;font-size:clamp(15px,1.7vw,20px)} #wishSun{margin-top:4px;font-size:clamp(13px,1.4vw,16px)}}

/* touch */
#touch{position:fixed;inset:auto 0 0 0;z-index:13;display:flex;justify-content:space-between;align-items:flex-end;padding:0 22px calc(env(safe-area-inset-bottom,0px) + 22px)}
#joy{width:120px;height:120px;border-radius:50%;border:1px solid var(--line);background:rgba(10,12,14,.35);display:grid;place-items:center;touch-action:none}
#joyKnob{width:50px;height:50px;border-radius:50%;background:rgba(245,239,228,.3);border:1px solid rgba(245,239,228,.4)}
#touchAct{width:78px;height:78px;border-radius:50%;border:1px solid rgba(242,179,107,.6);background:rgba(242,179,107,.25);color:var(--ink);font:600 12px var(--mono);letter-spacing:.08em}

#err{position:fixed;left:10px;bottom:10px;z-index:99;max-width:70vw;max-height:40vh;overflow:auto;background:rgba(80,0,0,.85);color:#fff;font:11px/1.4 var(--mono);padding:8px;white-space:pre-wrap;border-radius:6px}

@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(.9)}}
@keyframes pop{0%{transform:rotate(45deg) scale(.2)}100%{transform:rotate(45deg) scale(1)}}
@keyframes pip{0%{transform:scale(.3)}100%{transform:scale(1)}}
@keyframes float{0%,100%{transform:rotate(45deg) translate(0,0)}50%{transform:rotate(45deg) translate(-3px,-3px)}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
@media (max-width:640px){#card{bottom:calc(10.5vh + 20px)} #objective{font-size:14px}}
</style>
</head>
<body>
<canvas id="c" aria-label="Happy Birthday, Frida! A 3D journey"></canvas>

<div id="title"><h1></h1><p id="titleSub">This is Frida&rsquo;s world and we all just living in it</p></div>
<div id="credit">Made with love by el Nico <span aria-hidden="true">🤍</span></div>
<div id="press"><kbd>Enter</kbd><span id="pressText">Press Enter to begin</span></div>

<div id="hud"><div id="chapter"></div><div id="objective"><span class="dia"></span><span id="objText"></span></div></div>
<button id="mute" type="button" aria-label="Mute sound">
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6M22 9l-6 6"/></svg>
</button>

<canvas id="minimap" width="240" height="110" hidden aria-label="Map of the trail"></canvas>
<div id="prompt"><kbd>Enter</kbd><span id="promptText"></span></div>
<div id="marker" hidden><span class="dia"></span><span id="markerDist"></span></div>

<div id="card"><div id="cardEyebrow"></div><div id="cardTitle"></div><div id="cardRule"></div><div id="cardSub"></div></div>
<div id="skip"><kbd>Enter</kbd> Skip ahead</div>
<div id="sub"></div>

<section id="gallery" hidden aria-label="Photos and videos">
  <div class="g-top">
    <div class="g-titles"><div id="gStop">Stop 1 of 7</div><div id="gTitle"></div></div>
    <div id="gCount">1 / 1</div>
    <a id="gDownload" class="g-btn" href="#" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="lbl">Download</span></a>
    <button id="gClose" class="g-btn" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="g-stage" id="gStage">
    <button id="gPrev" class="g-nav" type="button" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="g-media" id="gMedia"></div>
    <button id="gNext" class="g-nav" type="button" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="g-strip" id="gStrip"></div>
  <div class="g-foot"><span class="keys"><kbd>&larr;</kbd><kbd>&rarr;</kbd> slide</span><span><kbd>Enter</kbd> keep going</span></div>
</section>

<section id="wish" hidden aria-live="polite">
  <h2 id="wishTitle"></h2>
  <p id="wishLove"></p>
  <p id="wishSun"></p>
</section>
<div id="fade"></div>
<div id="bigText"></div>
<div id="loader" class="show"><div class="load-in"><div class="load-title">Happy Birthday, Frida</div><div id="loaderMsg">Loading</div><div class="load-bar"><i></i></div></div></div>

<div id="touch" hidden><div id="joy"><div id="joyKnob"></div></div><button id="touchAct" type="button">ENTER</button></div>
<pre id="err" hidden></pre>

<script src="game.js"></script>
</body>
</html>
